map:
  pixel_size_m: 0.05 # Pixel side length [m]
  voxel_size_m: 0.5 # Voxel side length [m]
  normal_tolerance_deg: 3 # Normal change threshold to trigger reprojection of voxel image [°]
  smooth: True # Apply smoothing to the voxel image
  weighted: True # Weighted pixel update
  max_size: 1500000 # Maximum number of voxels to keep in the map
  frame: "odom"

preprocess:
  downsample_resolution_m: 0.1 # Downsample points to this resolution [m]. In case of informed sampling, this
  # corresponds to the high resolution voxels
  informed_sampling: True

optimization:
  huber_delta: 0.1 # Huber norm threshold

imu:  
    window_s: 10 # Time window for the inertial optimization [s]
    t_init: 0.2 # Time to initialize bias and gravity [s]
    frame: "imu"

path:
  publish: True # Publish the accumulated trajectory as a nav_msgs/Path
  max_poses: 0 # Poses kept in the path (0 = unlimited); oldest are dropped once reached

map_save: # THIS IS FOR THE PURE ODOMETRY MAP, NOT THE LOOP-CLOSED ONE. Use the bundle_path to save the loop-closed map.
  accumulate: True # Accumulate registered scans so the save_map service has something to write
  resolution_m: 0.05 # Voxel size the accumulated cloud of the pure odometry
  path: "bievr_map.pcd" # Becareful, this is the pure odometry map, not the loop-closed one. Use the bundle_path to save the loop-closed map.

loop_closure: # Scan Context + GTSAM pose graph, downstream of the odometry (bievr_pgo)
  enable: True # Off means the odometry runs exactly as before

  keyframe_meter_gap: 1.0 # Keep a keyframe every k m of travel
  keyframe_deg_gap: 15.0 # ...or every k deg of rotation
  keyframe_filter_size: 0.4 # Voxel leaf of the stored keyframe cloud [m]
  icp_filter_size: 0.4 # Voxel leaf of the loop-closure submap [m]

  # Scan Context descriptor
  sc_num_rings: 20
  sc_num_sectors: 60
  sc_max_radius: 80.0 # 80 outdoor; 20-40 indoor
  # Added to every point's z. Must exceed the depth of the lowest surface below
  # the sensor, with margin: too small and ground bins go negative and collide
  # with the 0 that marks an empty bin, which measurably worsens matching.
  sc_lidar_height: 2.0
  sc_num_exclude_recent: 30 # Keyframes before the query that cannot close a loop ( the gap lets stay )
  sc_num_candidates: 3
  sc_search_ratio: 0.1
  sc_dist_threshold: 0.5 # 0.1-0.15 for fewer false loops
  sc_tree_making_period: 30 # Rebuild the kd-tree every N queries
  loop_detect_frequency: 1.0 # Hz

  # Loop constraint via ICP
  history_keyframe_search_num: 25 # [-N, N] keyframes stacked into the target submap
  icp_max_correspondence_distance: 150.0
  icp_max_iterations: 100
  icp_transformation_epsilon: 1.0e-6
  icp_euclidean_fitness_epsilon: 1.0e-6
  icp_ransac_iterations: 0
  loop_fitness_score_threshold: 0.2 # Reject loops scoring above this
  # Seed ICP with Scan Context's yaw instead of identity. Measured worse on the
  # reference session (1.981 -> 2.156 m RMSE); only useful when revisits run in
  # the opposite direction, where identity cannot converge.
  use_sc_yaw_guess: False
  sc_yaw_guess_min_deg: 45.0

  # Factor graph noise (variances)
  prior_noise_score: 1.0e-12
  odom_noise_rotation: 1.0e-6
  odom_noise_translation: 1.0e-4
  loop_noise_score: 0.5
  loop_noise_cauchy_c: 1.0

  isam_relinearize_threshold: 0.01
  isam_relinearize_skip: 1
  isam_frequency: 10.0 # Hz

  max_queue: 8 # Pending keyframes before the oldest are dropped
  map_save_resolution: 0.1 # Voxel leaf of the saved/published map [m]; <=0 = full res
  path_publish_frequency: 10.0 # Hz
  map_publish_frequency: 0.1 # Hz (the map is heavy)
  # Destination of the map bundle (cloud.pcd, poses_tum.txt, scan_context.bin,
  # meta.yaml). Relative paths resolve against the working directory. Empty means
  # process_bag does not auto-save; the save_map_bundle service still works.
  bundle_path: "bievr_map_bundle"

localization: # Track a prior map, downstream of the odometry (bievr_localization)
  enable: False # Off means the odometry runs exactly as before

  # A .pcd file (any SLAM's map) or a bundle directory. Only a bundle carries the
  # Scan Context database that lets localization find itself; with a bare cloud it
  # waits for an /initialpose (RViz "2D Pose Estimate").
  map_path: "bievr_map_bundle"
  map_frame: "map" # Parent of the odometry frame. Kept distinct from map.frame above.

  map_voxel_size_m: 0.3 # Leaf applied to the prior map on load; 0 keeps it as stored
  map_viz_voxel_size_m: 0.0 # Coarser leaf for the published copy; 0 publishes it as loaded
  scan_voxel_size_m: 0.5 # Leaf applied to the scan before ICP
  # The prior map is cached as tiles of this side beside the source .pcd, and only
  # the ring around the current fix is held in RAM. 0 disables tiling.
  tile_size_m: 100.0
  # How much map to keep around the fix. Rounded UP to whole tiles, so 150/100 is
  # a 5x5 ring; too small a ring truncates the ICP target at tile edges.
  crop_radius_m: 150.0
  correction_frequency: 0.5 # Hz. The odometry carries the pose between corrections.

  # Coarse-to-fine ICP. The coarse pass runs at coarse_scale times the leaf sizes
  # and correspondence distance, which is what lets a seed several metres out
  # converge before the fine pass tightens it.
  coarse_scale: 10.0
  icp_max_correspondence_distance: 1.0 # Fine pass [m]
  icp_max_iterations: 20
  icp_transformation_epsilon: 1.0e-6
  icp_euclidean_fitness_epsilon: 1.0e-6
  # PCL fitness is the MEAN SQUARED correspondence distance [m^2], not an inlier
  # fraction. Reject above this; needs tuning per environment.
  fitness_threshold: 1.0

  # Relocalization. Descriptor geometry always comes from the bundle.
  sc_num_candidates: 3
  sc_search_ratio: 0.1
  sc_dist_threshold: 0.2 # Tighter than mapping: a false seed is expensive here
  use_sc_yaw_guess: True
  max_consecutive_failures: 5 # Rejections before the fix is dropped and a new seed sought

  publish_frequency: 50.0 # Hz, TF + the map-frame pose
  # The prior map has no publish rate: it is latched and resent only when the
  # resident map changes.

  # Localized trajectory as a nav_msgs/Path. One pose per odometry frame; the
  # whole path is resent every tick, so on a long run cap it here rather than
  # raising the rate.
  publish_path: True
  path_publish_frequency: 10.0 # Hz
  path_max_poses: 0 # 0 = unlimited; oldest are dropped once reached

debug:
  publish_all_clouds: False # Publish all clouds (fine, coarse, deskewed)
  timing: False
  log: False
  dashboard: True # Fancy live status print (position, biases, timing, ...)
  dashboard_ascii_path: "bievr_slam_ascii.txt" # ASCII art for the dashboard. A bare name is looked up next to the config; empty = bievr_ascii.txt.
  trajectory_path: "/home/soula/Desktop/PROJECTS/test_slams/src/BIEVR-LIO-SLAM/output/path_bievr" # Path to save trajectory. If empty, logs will not be saved.

max_num_threads: 0 # 0 = automatic, >0 = number of threads to use for parallel processing